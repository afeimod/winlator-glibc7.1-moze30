          cd /opt
          sudo wget -q https://sourceforge.net/projects/giflib/files/giflib-5.2.2.tar.gz
          sudo tar -xzf giflib-5.2.2.tar.gz
          cd giflib-5.2.2
          sudo sed -i 's/^PREFIX = \/usr\/local/PREFIX ?= \/usr\/local/' Makefile
          sudo sed -i 's/^all: allhtml manpages/all: manpages/' doc/Makefile
          sudo make -j$(nproc) \
            CC=aarch64-linux-gnu-gcc \
            AR=aarch64-linux-gnu-ar \
            RANLIB=aarch64-linux-gnu-ranlib \
            PREFIX=/data/data/com.winlator/files/imagefs/usr
          sudo make install \
            PREFIX=/data/data/com.winlator/files/imagefs/usr
      
      - name: 构建 jbigkit
        run: |
          cd /opt
          sudo wget -q https://sourceforge.net/projects/jbigkit/files/jbigkit-2.1.tar.gz
          sudo tar -xzf jbigkit-2.1.tar.gz
          cd jbigkit-2.1
          sudo make CC=aarch64-linux-gnu-gcc AR=aarch64-linux-gnu-ar RANLIB=aarch64-linux-gnu-ranlib
          sudo mkdir -p /data/data/com.winlator/files/imagefs/usr/include /data/data/com.winlator/files/imagefs/usr/lib
          sudo cp lib/*.h /data/data/com.winlator/files/imagefs/usr/include/
          sudo cp lib/*.a /data/data/com.winlator/files/imagefs/usr/lib/
          sudo cp lib/*.so* /data/data/com.winlator/files/imagefs/usr/lib/ 2>/dev/null || true
      
      - name: 构建 libtiff
        run: |
          cd /opt
