  build-wayland-keyboard:
    name: 构建 Wayland 和键盘库
    runs-on: ubuntu-24.04
    needs: build-opengl-libraries
    
    steps:
      - name: 准备环境
        run: |
          sudo mkdir -p /data/data/com.winlator/files/imagefs/usr
          sudo mkdir -p /data/data/com.winlator/files/imagefs/tmp
          sudo chmod -R 777 /data/data/com.winlator/files/imagefs
          sudo apt-get update
          sudo apt-get install -y wayland-protocols libxml2-dev libexpat1-dev zlib1g-dev
      
      - name: 下载构建环境
        uses: actions/download-artifact@v4
        with:
          name: opengl-libraries-package
          path: /data/data/com.winlator/files/imagefs/usr
      
      - name: 构建 libwayland
        run: |
          cd /opt
          sudo wget -q https://gitlab.freedesktop.org/wayland/wayland/-/releases/1.23.1/downloads/wayland-1.23.1.tar.xz
          sudo tar -xf wayland-1.23.1.tar.xz
          cd wayland-1.23.1
          printf '%s\n' \
            '--- a/cursor/os-compatibility.c' \
            '+++ b/cursor/os-compatibility.c' \
            '@@ -138,8 +138,7 @@' \
            ' {' \
            ' 	path = getenv("XDG_RUNTIME_DIR");' \
            ' 	if (!path || path[0] != '\''\/'\'') {' \
            '-\t\t\terrno = ENOENT;' \
            '-\t\t\treturn -1;' \
            '+\t\t\tpath = "/data/data/com.winlator/files/imagefs/tmp";' \
            ' 	}' \
            ' ' \
            ' 	name_size = strlen(path) + sizeof(template);' \
            '--- a/src/wayland-client.c' \
            '+++ b/src/wayland-client.c' \
            '@@ -1109,11 +1109,7 @@' \
            ' ' \
            ' 	runtime_dir = getenv("XDG_RUNTIME_DIR");' \
            ' 	if (((!runtime_dir || runtime_dir[0] != '\''\/'\'') && !path_is_absolute)) {' \
            '-\t\t\twl_log("error: XDG_RUNTIME_DIR is invalid or not set in the environment.\n");' \
            '-\t\t\t/* to prevent programs reporting' \
            '-\t\t\t * "failed to create display: Success" */' \
            '-\t\t\terrno = ENOENT;' \
            '-\t\t\treturn -1;' \
            '+\t\t\truntime_dir = "/data/data/com.winlator/files/imagefs/tmp";' \
            ' 	}' \
            ' ' \
            ' 	fd = wl_os_socket_cloexec(PF_LOCAL, SOCK_STREAM, 0);' \
            '--- a/src/wayland-server.c' \
            '+++ b/src/wayland-server.c' \
            '@@ -1629,13 +1629,7 @@' \
            ' 	if (name[0] != '\''\/'\'') {' \
            ' \t\truntime_dir = getenv("XDG_RUNTIME_DIR");' \
            ' \t\tif (!runtime_dir || runtime_dir[0] != '\''\/'\'') {' \
            '-\t\t\twl_log("error: XDG_RUNTIME_DIR is invalid or not set in"' \
            '-\t\t\t       " the environment\n");' \
            ' ' \
            '-\t\t\t/* to prevent programs reporting' \
            '-\t\t\t * "failed to add socket: Success" */' \
            '-\t\t\terrno = ENOENT;' \
            '-\t\t\treturn -1;' \
            '+\t\t\truntime_dir = "/data/data/com.winlator/files/imagefs/tmp";' \
            ' \t\t}' \
            ' \t\tseparator = "/";' \
            ' \t}' \
            > setdirs.patch
          sudo patch -p1 < setdirs.patch
          printf '%s\n' \
            '[binaries]' \
            "c = 'aarch64-linux-gnu-gcc'" \
            "cpp = 'aarch64-linux-gnu-g++'" \
            "ar = 'aarch64-linux-gnu-ar'" \
            "strip = 'aarch64-linux-gnu-strip'" \
            "pkgconfig = 'aarch64-linux-gnu-pkg-config'" \
            '' \
            '[host_machine]' \
            "system = 'linux'" \
            "cpu_family = 'aarch64'" \
            "cpu = 'aarch64'" \
            "endian = 'little'" \
            '' \
            '[properties]' \
            "needs_exe_wrapper = true" \
            > cross-aarch64.txt
          printf '%s\n' \
            '[binaries]' \
            "c = 'gcc'" \
            "cpp = 'g++'" \
            "ar = 'ar'" \
            "strip = 'strip'" \
            "pkgconfig = 'pkg-config'" \
            "wayland-scanner = '/usr/bin/wayland-scanner'" \
            > native.txt
          export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          sudo meson setup builddir \
            --cross-file cross-aarch64.txt \
            --native-file native.txt \
            --prefix=/data/data/com.winlator/files/imagefs/usr \
            -Ddocumentation=false
          sudo meson compile -C builddir
          sudo meson install -C builddir
      
      - name: 构建 xkeyboard-config
        run: |
          cd /opt
          sudo wget -q https://xorg.freedesktop.org/archive/individual/data/xkeyboard-config/xkeyboard-config-2.43.tar.xz
          sudo tar -xf xkeyboard-config-2.43.tar.xz
          cd xkeyboard-config-2.43
          sudo meson setup builddir \
            --prefix=/data/data/com.winlator/files/imagefs/usr \
            -Dxkb-base=/data/data/com.winlator/files/imagefs/usr/share/X11/xkb \
            -Dcompat-rules=true \
            -Dxorg-rules-symlinks=true
          sudo meson compile -C builddir
          sudo meson install -C builddir
      
      - name: 构建 libxkbcommon
        run: |
          cd /opt
          sudo wget -q https://github.com/xkbcommon/libxkbcommon/archive/xkbcommon-1.8.0.tar.gz -O libxkbcommon-1.8.0.tar.gz
          sudo tar -xzf libxkbcommon-1.8.0.tar.gz
          cd libxkbcommon-xkbcommon-1.8.0
          printf '%s\n' \
            '[binaries]' \
            "c = 'aarch64-linux-gnu-gcc'" \
            "cpp = 'aarch64-linux-gnu-g++'" \
            "ar = 'aarch64-linux-gnu-ar'" \
            "strip = 'aarch64-linux-gnu-strip'" \
            "pkgconfig = 'pkg-config'" \
            '' \
            '[host_machine]' \
            "system = 'linux'" \
            "cpu_family = 'aarch64'" \
            "cpu = 'aarch64'" \
            "endian = 'little'" \
            > cross-aarch64.txt
          export PKG_CONFIG_LIBDIR=/data/data/com.winlator/files/imagefs/usr/lib/pkgconfig:/data/data/com.winlator/files/imagefs/usr/share/pkgconfig
          export PKG_CONFIG_SYSROOT_DIR=/data/data/com.winlator/files/imagefs
          sudo meson setup builddir \
            --cross-file cross-aarch64.txt \
            --prefix=/data/data/com.winlator/files/imagefs/usr \
            -Denable-wayland=false \
            -Denable-x11=true \
            -Denable-docs=false
          sudo meson compile -C builddir
          sudo meson install -C builddir
      
      - name: 上传 Wayland 和键盘库
        uses: actions/upload-artifact@v4
        with:
          name: wayland-keyboard-package
          path: /data/data/com.winlator/files/imagefs/usr
          retention-days: 1

  build-x11-tools:
    name: 构建 X11 工具库
    runs-on: ubuntu-24.04
    needs: build-wayland-keyboard
    
    steps:
      - name: 准备环境
        run: |
          sudo mkdir -p /data/data/com.winlator/files/imagefs/usr
          sudo mkdir -p /data/data/com.winlator/files/imagefs/tmp
          sudo chmod -R 777 /data/data/com.winlator/files/imagefs
      
      - name: 下载构建环境
        uses: actions/download-artifact@v4
        with:
          name: wayland-keyboard-package
          path: /data/data/com.winlator/files/imagefs/usr
      
      - name: 构建 libICE
        run: |
          cd /opt
          sudo git clone https://gitlab.freedesktop.org/xorg/lib/libice.git
          cd libice
          sudo ./autogen.sh \
            --host=aarch64-linux-gnu \
            --build=x86_64-linux-gnu \
            --prefix=/data/data/com.winlator/files/imagefs/usr
          sudo make -j$(nproc)
          sudo make install
      
      - name: 构建 util-linux
        run: |
          cd /opt
          sudo git clone https://github.com/termux-pacman/glibc-packages.git termux-glibc 2>/dev/null || true
          sudo wget -q https://github.com/util-linux/util-linux/archive/refs/tags/v2.40.2.tar.gz -O util-linux-2.40.2.tar.gz
          sudo tar -xzf util-linux-2.40.2.tar.gz
          cd util-linux-2.40.2
          PATCH_FILE=/opt/glibc-packages/gpkg/util-linux/setdirs.patch
          PREFIX=/data/data/com.winlator/files/imagefs/usr
          TMPDIR=/data/data/com.winlator/files/imagefs/tmp
          if [ -f ${PATCH_FILE} ]; then
            sudo sed -i "s|@TERMUX_PREFIX@|${PREFIX}|g" ${PATCH_FILE}
            sudo sed -i "s|@TERMUX_PREFIX_CLASSICAL@|${TMPDIR}|g" ${PATCH_FILE}
            sudo patch -p1 < ${PATCH_FILE}
          fi
          sudo ./autogen.sh
          sudo ./configure \
            --host=aarch64-linux-gnu \
            --build=x86_64-linux-gnu \
            --prefix=${PREFIX} \
            --libdir=${PREFIX}/lib \
            --libexecdir=${PREFIX}/lib \
            --sysconfdir=${PREFIX}/etc \
            --localstatedir=${PREFIX}/var \
            --runstatedir=${PREFIX}/var/run \
            --mandir=${PREFIX}/share/man \
            --infodir=${PREFIX}/share/info \
            --without-ncurses \
            --without-ncursesw \
            --without-tinfo \
            --without-selinux \
            --without-audit \
            --without-udev \
            --without-systemd \
            --disable-bash-completion \
            --disable-pylibmount \
            --disable-makeinstall-chown \
            --disable-makeinstall-setuid \
            --disable-liblastlog2 \
            --without-sqlite3 \
            --disable-nls
          sudo make -j$(nproc)
          sudo make install
      
      - name: 构建 libSM
        run: |
          cd /opt
          sudo git clone https://gitlab.freedesktop.org/xorg/lib/libsm.git
          cd libsm
          sudo ./autogen.sh \
            --host=aarch64-linux-gnu \
            --build=x86_64-linux-gnu \
            --prefix=/data/data/com.winlator/files/imagefs/usr
          sudo make -j$(nproc)
          sudo make install
      
      - name: 构建 libXt
        run: |
          cd /opt
          sudo git clone https://gitlab.freedesktop.org/xorg/lib/libxt.git
          cd libxt
          sudo ./autogen.sh \
            --host=aarch64-linux-gnu \
            --build=x86_64-linux-gnu \
            --prefix=/data/data/com.winlator/files/imagefs/usr
          sudo make -j$(nproc)
          sudo make install
      
      - name: 构建 libXmu
        run: |
          cd /opt
          sudo git clone https://gitlab.freedesktop.org/xorg/lib/libxmu.git
          cd libxmu
          sudo ./autogen.sh \
            --host=aarch64-linux-gnu \
            --build=x86_64-linux-gnu \
            --prefix=/data/data/com.winlator/files/imagefs/usr
          sudo make -j$(nproc)
          sudo make install
      
      - name: 构建 libXpm
        run: |
          cd /opt
          sudo wget -q https://github.com/xorg-proto/xorgproto/releases/download/2024.1/xorgproto-2024.1.tar.gz
          sudo tar -xzf xorgproto-2024.1.tar.gz
          cd /opt
          sudo wget -q https://xorg.freedesktop.org/archive/individual/lib/libXpm-4.11.0.tar.xz
          sudo tar -xf libXpm-4.11.0.tar.xz
          cd libXpm-4.11.0
          sudo ./configure \
            --host=aarch64-linux-gnu \
            --build=x86_64-linux-gnu \
            --prefix=/data/data/com.winlator/files/imagefs/usr \
            --enable-shared \
            --disable-static
          sudo make -j$(nproc)
          sudo make install INSTALL_PROGRAM="/usr/bin/install -c"
      
      - name: 构建 libXaw
        run: |
          cd /opt
          sudo git clone https://gitlab.freedesktop.org/xorg/lib/libXaw.git
          cd libXaw
          sudo ./autogen.sh \
            --host=aarch64-linux-gnu \
            --build=x86_64-linux-gnu \
            --prefix=/data/data/com.winlator/files/imagefs/usr
          sudo make -j$(nproc)
          sudo make install
      
      - name: 上传 X11 工具库
        uses: actions/upload-artifact@v4
        with:
          name: x11-tools-package
          path: /data/data/com.winlator/files/imagefs/usr
          retention-days: 1

  build-dbus-pulse:
    name: 构建 D-Bus 和 PulseAudio
    runs-on: ubuntu-24.04
    needs: build-x11-tools
    
    steps:
      - name: 准备环境
        run: |
          sudo mkdir -p /data/data/com.winlator/files/imagefs/usr
          sudo mkdir -p /data/data/com.winlator/files/imagefs/tmp
          sudo chmod -R 777 /data/data/com.winlator/files/imagefs
      
      - name: 下载构建环境
        uses: actions/download-artifact@v4
        with:
          name: x11-tools-package
          path: /data/data/com.winlator/files/imagefs/usr
      
      - name: 构建 dbus
        run: |
          cd /opt
          sudo wget -q https://dbus.freedesktop.org/releases/dbus/dbus-1.15.6.tar.xz
          sudo tar -xf dbus-1.15.6.tar.xz
          cd dbus-1.15.6
          PREFIX=/data/data/com.winlator/files/imagefs/usr
          TMPDIR=/data/data/com.winlator/files/imagefs/tmp
          printf '%s\n' \
            '--- a/dbus/dbus-sysdeps-unix.c' \
            '+++ b/dbus/dbus-sysdeps-unix.c' \
            '@@ -3602,7 +3602,7 @@' \
            ' ' \
            '       /* And this is the sane fallback. */' \
            '       if (tmpdir == NULL)' \
            '-        tmpdir = "/tmp";' \
            '+        tmpdir = "/data/data/com.winlator/files/imagefs/tmp";' \
            '     }' \
            ' ' \
            '   _DBUS_UNLOCK (sysdeps);' \
            > dbus-sysdeps-unix.patch
          sudo patch -p1 < dbus-sysdeps-unix.patch
          export PKG_CONFIG_LIBDIR=${PREFIX}/lib/pkgconfig:${PREFIX}/share/pkgconfig
          export PKG_CONFIG_SYSROOT_DIR=/data/data/com.winlator/files/imagefs
          sudo ./configure \
            --host=aarch64-linux-gnu \
            --build=x86_64-linux-gnu \
            --prefix=${PREFIX} \
            --libdir=${PREFIX}/lib \
            --libexecdir=${PREFIX}/lib \
            --sysconfdir=${PREFIX}/etc \
            --localstatedir=${PREFIX}/var \
            --runstatedir=${PREFIX}/var/run \
            --disable-libaudit \
            --disable-systemd \
            --disable-tests \
            --disable-xml-docs \
            --enable-inotify \
            --enable-x11-autolaunch \
            --with-test-socket-dir=${TMPDIR} \
            --with-session-socket-dir=${TMPDIR} \
            --with-x=auto \
            --without-systemdsystemunitdir \
            --disable-selinux
          sudo make -j$(nproc)
          sudo make install
      
      - name: 构建 doxygen
        run: |
          cd /opt
          sudo wget -q https://doxygen.nl/files/doxygen-1.12.0.src.tar.gz
          sudo tar -xzf doxygen-1.12.0.src.tar.gz
          cd doxygen-1.12.0
          sudo mkdir build && cd build
          sudo cmake .. -DCMAKE_INSTALL_PREFIX=/data/data/com.winlator/files/imagefs/usr
          sudo make -j$(nproc)
          sudo make install
      
      - name: 构建 libpulse
        run: |
          cd /opt
          sudo git clone https://github.com/pulseaudio/pulseaudio.git
          cd pulseaudio
          sudo git checkout v17.0
          PREFIX=/data/data/com.winlator/files/imagefs/usr
          TMPDIR=/data/data/com.winlator/files/imagefs/tmp
          PATCH_DIR=/opt/glibc-packages/gpkg/libpulse
          if [ -f ${PATCH_DIR}/fix-paths.patch ]; then
            sudo sed -i "s|@TERMUX_PREFIX@|${PREFIX}|g; s|@TERMUX_PREFIX_CLASSICAL@|${TMPDIR}|g" \
              ${PATCH_DIR}/fix-paths.patch
            sudo patch -p1 < ${PATCH_DIR}/fix-paths.patch
          fi
          printf '%s\n' \
            '[binaries]' \
            "c = 'aarch64-linux-gnu-gcc'" \
            "cpp = 'aarch64-linux-gnu-g++'" \
            "ar = 'aarch64-linux-gnu-ar'" \
            "strip = 'aarch64-linux-gnu-strip'" \
            "pkgconfig = 'pkg-config'" \
            '' \
            '[host_machine]' \
            "system = 'linux'" \
            "cpu_family = 'aarch64'" \
            "cpu = 'aarch64'" \
            "endian = 'little'" \
            > cross-aarch64.txt
          export PKG_CONFIG_LIBDIR=${PREFIX}/lib/pkgconfig:${PREFIX}/share/pkgconfig
          export PKG_CONFIG_SYSROOT_DIR=/data/data/com.winlator/files/imagefs
          sudo meson setup builddir \
            --cross-file cross-aarch64.txt \
            --prefix=/data/data/com.winlator/files/imagefs/usr \
            -Ddaemon=false \
            -Dman=false \
            -Dtests=false \
            -Ddatabase=gdbm \
            -Dx11=enabled \
            -Ddbus=enabled \
            -Dalsa=enabled \
            -Ddoxygen=false
          sudo meson compile -C builddir
          sudo meson install -C builddir
          if [ -f ${PATCH_DIR}/pulseaudio-start.sh ]; then
            sudo install -m755 ${PATCH_DIR}/pulseaudio-start.sh ${PREFIX}/bin/pulseaudio-start
            sudo sed -i -e "s|@TERMUX_PREFIX_CLASSICAL@|${TMPDIR}|g" \
              -e "s|@TERMUX_PREFIX@|${PREFIX}|g" \
              ${PREFIX}/bin/pulseaudio-start
          fi
      
      - name: 构建 libunwind
        run: |
          cd /opt
          sudo wget -q https://github.com/libunwind/libunwind/releases/download/v1.8.1/libunwind-1.8.1.tar.gz
          sudo tar -xzf libunwind-1.8.1.tar.gz
          cd libunwind-1.8.1
          sudo ./configure \
            --host=aarch64-linux-gnu \
            --build=x86_64-linux-gnu \
            --prefix=/data/data/com.winlator/files/imagefs/usr \
            --enable-cxx \
            --disable-static
          sudo make -j$(nproc)
          sudo make install INSTALL_PROGRAM="/usr/bin/install -c"
      
      - name: 上传 D-Bus 和 PulseAudio
        uses: actions/upload-artifact@v4
        with:
          name: dbus-pulse-package
          path: /data/data/com.winlator/files/imagefs/usr
          retention-days: 1

  build-box64:
    name: 构建 Box64
    runs-on: ubuntu-24.04
    needs: build-dbus-pulse
    
    steps:
      - name: 准备环境
        run: |
          sudo mkdir -p /data/data/com.winlator/files/imagefs/usr
          sudo mkdir -p /data/data/com.winlator/files/imagefs/tmp
          sudo chmod -R 777 /data/data/com.winlator/files/imagefs
      
      - name: 下载构建环境
        uses: actions/download-artifact@v4
        with:
          name: dbus-pulse-package
          path: /data/data/com.winlator/files/imagefs/usr
      
      - name: 构建 box64
        run: |
          cd /opt
          sudo git clone https://github.com/ptitSeb/box64.git
          cd box64
          sudo mkdir build && cd build
          export LDFLAGS="-s -Wl,--dynamic-linker=/data/data/com.winlator/files/imagefs/usr/lib/ld-linux-aarch64.so.1 -Wl,-rpath=/data/data/com.winlator/files/imagefs/usr/lib"
          sudo cmake .. \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DARM64=ON \
            -DARM_DYNAREC=ON \
            -DBAD_SIGNAL=ON \
            -DWINLATOR_GLIBC=ON \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_CROSSCOMPILING=TRUE
          sudo make -j$(nproc)
          sudo make install DESTDIR=$PWD/package
      
      - name: 打包构建产物
        run: |
          cd /data/data/com.winlator/files
          sudo tar -czvf imagefs.tar.gz imagefs
          echo "打包完成，文件大小："
          ls -lh imagefs.tar.gz
      
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: winlator-glibc-complete
          path: /data/data/com.winlator/files/imagefs.tar.gz
          retention-days: 5

  final-build:
    name: 完成构建
    runs-on: ubuntu-24.04
    needs: build-box64
    if: always()
    
    steps:
      - name: 清理临时文件
        run: |
          sudo rm -rf /opt/build /opt/glibc-* /opt/gcc-* /opt/box64 2>/dev/null || true
          echo "构建完成，临时文件已清理"
      
      - name: 总结
        run: |
          echo "=========================================="
          echo "Winlator Glibc 交叉编译构建完成！"
          echo "=========================================="
          echo ""
          echo "安装路径: /data/data/com.winlator/files/imagefs/usr"
          echo "临时目录: /data/data/com.winlator/files/imagefs/tmp"
          echo "系统根目录: /data/data/com.winlator/files/imagefs"
          echo ""
          echo "包含的核心库："
          echo "  - Glibc 2.42"
          echo "  - GCC-Libs 14.2.0"
          echo "  - X11 完整库"
          echo "  - Cairo/Pango"
          echo "  - 音频/视频编解码库"
          echo "  - OpenGL/Vulkan 支持"
          echo "  - Box64 模拟器"
          echo "=========================================="