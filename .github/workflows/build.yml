      - name: 构建 libxshmfence
        run: |
          cd /opt
          sudo git clone https://gitlab.freedesktop.org/xorg/lib/libxshmfence.git
          cd libxshmfence
          sudo ./configure \
            --host=aarch64-linux-gnu \
            --build=x86_64-linux-gnu \
            --prefix=/data/data/com.winlator/files/imagefs/usr
          sudo make -j$(nproc)
          sudo make install
      
      - name: 构建 libjpeg-turbo
        run: |
          cd /opt
          sudo wget -q https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.1.0/libjpeg-turbo-3.1.0.tar.gz
          sudo tar -xzf libjpeg-turbo-3.1.0.tar.gz
          cd libjpeg-turbo-3.1.0
          printf '%s\n' \
            "set(CMAKE_SYSTEM_NAME Linux)" \
            "set(CMAKE_SYSTEM_PROCESSOR aarch64)" \
            "set(CMAKE_SYSROOT /data/data/com.winlator/files/imagefs)" \
            "set(CMAKE_C_COMPILER aarch64-linux-gnu-gcc)" \
            "set(CMAKE_CXX_COMPILER aarch64-linux-gnu-g++)" \
            "set(CMAKE_FIND_ROOT_PATH /data/data/com.winlator/files/imagefs/usr)" \
            "set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)" \
            "set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)" \
            "set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)" \
            > toolchain-aarch64.cmake
          sudo cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=toolchain-aarch64.cmake \
            -DCMAKE_INSTALL_PREFIX=/data/data/com.winlator/files/imagefs/usr \
            -DENABLE_SHARED=ON \
            -DENABLE_STATIC=OFF \
            -DWITH_JPEG8=ON
          sudo cmake --build build --parallel $(nproc)
          sudo cmake --install build
      
      - name: 构建 giflib
