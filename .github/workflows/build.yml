  build-font-libraries:
    name: 构建字体库
    runs-on: ubuntu-24.04
    needs: build-x11-extended
    
    steps:
      - name: 准备环境
        run: |
          sudo mkdir -p /data/data/com.winlator/files/imagefs/usr
          sudo mkdir -p /data/data/com.winlator/files/imagefs/tmp
          sudo chmod -R 777 /data/data/com.winlator/files/imagefs
      
      - name: 下载构建环境
        uses: actions/download-artifact@v4
        with:
          name: x11-extended-package
          path: /data/data/com.winlator/files/imagefs/usr
      
      - name: 构建 freetype
        run: |
          cd /opt
          sudo wget -q https://downloads.sourceforge.net/freetype/freetype-2.13.3.tar.xz
          sudo tar -xf freetype-2.13.3.tar.xz
          cd freetype-2.13.3
          sudo wget -q https://raw.githubusercontent.com/afeimod/winlator-glibc7.1-moze30/main/meson-cross/freetype/cross-aarch64.txt \
            -O cross-aarch64.txt
          export PKG_CONFIG_LIBDIR=/data/data/com.winlator/files/imagefs/usr/lib/pkgconfig:/data/data/com.winlator/files/imagefs/usr/share/pkgconfig
          export PKG_CONFIG_SYSROOT_DIR=/data/data/com.winlator/files/imagefs
          sudo meson setup builddir \
            --cross-file cross-aarch64.txt \
            --prefix=/data/data/com.winlator/files/imagefs/usr \
            -Ddefault_library=shared
          sudo meson compile -C builddir
          sudo meson install -C builddir
      
      - name: 构建 libexpat
        run: |
          cd /opt
          sudo wget -q https://github.com/libexpat/libexpat/releases/download/R_2_6_4/expat-2.6.4.tar.xz
          sudo tar -xf expat-2.6.4.tar.xz
          cd expat-2.6.4
          sudo ./configure \
            --host=aarch64-linux-gnu \
            --build=x86_64-linux-gnu \
            --prefix=/data/data/com.winlator/files/imagefs/usr \
            --disable-static
          sudo make -j$(nproc)
          sudo make install INSTALL_PROGRAM="/usr/bin/install -c"
      
      - name: 构建 fontconfig
        run: |
          cd /opt
          sudo wget -q https://gitlab.freedesktop.org/fontconfig/fontconfig/-/archive/2.15.0/fontconfig-2.15.0.tar.gz
          sudo tar -xzf fontconfig-2.15.0.tar.gz
          cd fontconfig-2.15.0
          printf '%s\n' \
            '--- a/src/fcatomic.c' \
            '+++ b/src/fcatomic.c' \
            '@@ -130,15 +130,12 @@' \
            ' 	unlink ((char *) atomic->tmp);' \
            ' 	return FcFalse;' \
            '     }' \
            '-    ret = link ((char *) atomic->tmp, (char *) atomic->lck);' \
            '-    if (ret < 0 && (errno == EPERM || errno == ENOTSUP || errno == EACCES))' \
            '-    {' \
            '' \
            ' 	/* the filesystem where atomic->lck points to may not supports' \
            ' 	 * the hard link. so better try to fallback' \
            ' 	 */' \
            ' 	ret = mkdir ((char *) atomic->lck, 0600);' \
            ' 	no_link = FcTrue;' \
            '-    }' \
            '     (void) unlink ((char *) atomic->tmp);' \
            ' #else' \
            '     ret = mkdir ((char *) atomic->lck, 0600);' \
            > fcatomic.patch
          sudo patch -p1 < fcatomic.patch
          printf '%s\n' \
            '[binaries]' \
            "c = 'aarch64-linux-gnu-gcc'" \
            "cpp = 'aarch64-linux-gnu-g++'" \
            "ar = 'aarch64-linux-gnu-ar'" \
            "strip = 'aarch64-linux-gnu-strip'" \
            "pkgconfig = 'pkg-config'" \
            '' \
            '[host_machine]' \
            "system = 'linux'" \
            "cpu_family = 'aarch64'" \
            "cpu = 'aarch64'" \
            "endian = 'little'" \
            > cross-aarch64.txt
          export PKG_CONFIG_LIBDIR=/data/data/com.winlator/files/imagefs/usr/lib/pkgconfig:/data/data/com.winlator/files/imagefs/usr/share/pkgconfig
          export PKG_CONFIG_SYSROOT_DIR=/data/data/com.winlator/files/imagefs
          sudo meson setup builddir \
            --cross-file cross-aarch64.txt \
            --prefix=/data/data/com.winlator/files/imagefs/usr \
            -Ddefault-fonts-dirs=/system/fonts,/data/data/com.winlator/files/imagefs/usr/share/fonts \
            -Ddefault-hinting=slight \
            -Ddefault-sub-pixel-rendering=rgb \
            -Ddoc-html=disabled \
            -Ddoc-pdf=disabled \
            -Ddoc-txt=disabled
          sudo meson compile -C builddir
          sudo meson install -C builddir
      
      - name: 上传字体库
        uses: actions/upload-artifact@v4
        with:
          name: font-libraries-package
          path: /data/data/com.winlator/files/imagefs/usr
          retention-days: 1

  build-glib-gio:
    name: 构建 GLib/GIO
    runs-on: ubuntu-24.04
    needs: build-font-libraries
    
    steps:
      - name: 准备环境
        run: |
          sudo mkdir -p /data/data/com.winlator/files/imagefs/usr
          sudo mkdir -p /data/data/com.winlator/files/imagefs/tmp
          sudo chmod -R 777 /data/data/com.winlator/files/imagefs
      
      - name: 下载构建环境
        uses: actions/download-artifact@v4
        with:
          name: font-libraries-package
          path: /data/data/com.winlator/files/imagefs/usr
      
      - name: 构建 pcre2
        run: |
          cd /opt
          sudo wget -q https://github.com/PhilipHazel/pcre2/releases/download/pcre2-10.45/pcre2-10.45.tar.bz2
          sudo tar -xf pcre2-10.45.tar.bz2
          cd pcre2-10.45
          sudo ./configure \
            --host=aarch64-linux-gnu \
            --build=x86_64-linux-gnu \
            --prefix=/data/data/com.winlator/files/imagefs/usr \
            --disable-static \
            --enable-pcre2-16 \
            --enable-pcre2-32 \
            --enable-jit \
            --enable-pcre2grep-libz \
            --enable-pcre2grep-libbz2 \
            --enable-pcre2grep-libreadline \
            --enable-malloc0returnsnull=no \
            CPPFLAGS="-I/data/data/com.winlator/files/imagefs/usr/include" \
            LDFLAGS="-L/data/data/com.winlator/files/imagefs/usr/lib"
          sudo make -j$(nproc)
          sudo make install INSTALL_PROGRAM="/usr/bin/install -c"
      
      - name: 构建 glib
        run: |
          cd /opt
          sudo wget -q https://ftp.gnome.org/pub/gnome/sources/glib/2.82/glib-2.82.2.tar.xz
          sudo tar -xf glib-2.82.2.tar.xz
          cd glib-2.82.2
          
          # 应用补丁
          sudo sed -i 's|"/usr/share/locale/locale.alias"|"/data/data/com.winlator/files/imagefs/usr/share/locale/locale.alias"|' glib/gcharset.c
          sudo sed -i 's|"/bin:/usr/bin:."|"/data/data/com.winlator/files/imagefs/usr/bin:."|' glib/gspawn-posix.c
          sudo sed -i 's|"/bin/sh"|"/data/data/com.winlator/files/imagefs/usr/bin/sh"|' glib/gspawn-posix.c
          sudo sed -i 's|"/bin:/usr/bin:."|"/data/data/com.winlator/files/imagefs/usr/bin:."|' glib/gutils.c
          sudo sed -i 's|"/tmp"|"/data/data/com.winlator/files/imagefs/tmp"|' glib/gutils.c
          sudo sed -i 's|"/etc/os-release", "/usr/lib/os-release"|"/data/data/com.winlator/files/imagefs/usr/etc/os-release", "/data/data/com.winlator/files/imagefs/usr/lib/os-release"|' glib/gutils.c
          sudo sed -i 's|"/usr/local/share/:/usr/share/"|"/data/data/com.winlator/files/imagefs/usr/local/share/:/data/data/com.winlator/files/imagefs/usr/share/"|' glib/gutils.c
          sudo sed -i 's|"/etc/machine-id"|"/data/data/com.winlator/files/imagefs/usr/etc/machine-id"|' gio/gdbusprivate.c
          sudo sed -i 's|"/etc/glib-2.0/settings"|"/data/data/com.winlator/files/imagefs/usr/etc/glib-2.0/settings"|' gio/gkeyfilesettingsbackend.c
          sudo sed -i 's|"/etc/resolv.conf"|"/data/data/com.winlator/files/imagefs/usr/etc/resolv.conf"|' gio/gnetworking.h.in
          sudo sed -i 's|"/usr/local/share/:/usr/share/"|"/data/data/com.winlator/files/imagefs/usr/local/share/:/data/data/com.winlator/files/imagefs/usr/share/"|' gio/xdgmime/xdgmime.c
          
          # 移除 pidfd_open 检测
          sudo sed -i '/^# Check for pidfd_open/,/^endif$/d' meson.build
          
          printf '%s\n' \
            '[binaries]' \
            "c = 'aarch64-linux-gnu-gcc'" \
            "cpp = 'aarch64-linux-gnu-g++'" \
            "ar = 'aarch64-linux-gnu-ar'" \
            "strip = 'aarch64-linux-gnu-strip'" \
            "pkgconfig = 'pkg-config'" \
            '' \
            '[host_machine]' \
            "system = 'linux'" \
            "cpu_family = 'aarch64'" \
            "cpu = 'aarch64'" \
            "endian = 'little'" \
            > cross-aarch64.txt
          
          export PKG_CONFIG_LIBDIR=/data/data/com.winlator/files/imagefs/usr/lib/pkgconfig:/data/data/com.winlator/files/imagefs/usr/share/pkgconfig
          export PKG_CONFIG_SYSROOT_DIR=/data/data/com.winlator/files/imagefs
          
          sudo meson setup builddir \
            --cross-file cross-aarch64.txt \
            --prefix=/data/data/com.winlator/files/imagefs/usr \
            -Ddefault_library=both \
            -Druntime_dir=/data/data/com.winlator/files/imagefs/usr/var/run \
            -Dglib_debug=disabled \
            -Dselinux=disabled \
            -Dlibmount=disabled \
            -Dtests=false \
            -Ddocumentation=false \
            -Dman-pages=false \
            -Dintrospection=disabled
          
          sudo meson compile -C builddir
          sudo meson install -C builddir
      
      - name: 上传 GLib/GIO
        uses: actions/upload-artifact@v4
        with:
          name: glib-gio-package
          path: /data/data/com.winlator/files/imagefs/usr
          retention-days: 1

