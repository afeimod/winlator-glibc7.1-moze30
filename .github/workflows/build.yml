name: Winlator Glibc 构建

run-name: 手动触发构建 - ${{ github.event.inputs.build_type || '完整构建' }}

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - core
          - x11
          - multimedia
      build_locale:
        description: '构建语言'
        required: true
        default: 'zh_CN'
        type: choice
        options:
          - zh_CN
          - en_US
      packages:
        description: '指定包名（多个用逗号分隔，可选）'
        required: false
        type: string

permissions:
  contents: read

env:
  # 统一安装目录
  INSTALL_PREFIX: /data/data/com.winlator/files/imagefs/usr
  GLIBC_VERSION: '2.42'
  BUILD_LOCALE: ${{ github.event.inputs.build_locale || 'zh_CN' }}

jobs:
  setup-build-env:
    name: 环境准备
    runs-on: ubuntu-24.04
    
    outputs:
      build_id: ${{ steps.date.outputs.build_id }}
    
    steps:
      - name: 生成构建ID
        id: date
        run: echo "build_id=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
      
      - name: 检出仓库
        uses: actions/checkout@v4
      
      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gettext bison flex python3 texinfo gawk sed \
            grep bash perl jq git wget \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            pkg-config meson ninja-build cmake \
            autoconf automake libtool \
            xz-utils bzip2 gzip \
            libc6-dev-arm64-cross linux-libc-dev-arm64-cross

      - name: 创建工作目录
        run: |
          sudo mkdir -p /opt/build
          sudo mkdir -p /data/data/com.winlator/files/imagefs/usr
          sudo mkdir -p /data/data/com.winlator/files/imagefs/tmp
          sudo chmod -R 777 /opt/build
          sudo chmod -R 777 /data/data/com.winlator/files/imagefs
      
      - name: 克隆依赖仓库
        run: |
          cd /opt
          sudo git clone https://github.com/termux-pacman/glibc-packages.git || sudo git -C glibc-packages pull
          sudo git clone https://github.com/moze30/winlator-wcp.git || sudo git -C winlator-wcp pull
      
      - name: 上传构建环境信息
        uses: actions/upload-artifact@v4
        with:
          name: build-env-${{ steps.date.outputs.build_id }}
          path: |
            /opt/glibc-packages
            /opt/winlator-wcp
          retention-days: 1

  build-core-libraries:
    name: 构建核心库
    runs-on: ubuntu-24.04
    needs: setup-build-env
    
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      
      - name: 下载构建环境
        uses: actions/download-artifact@v4
        with:
          name: build-env-${{ needs.setup-build-env.outputs.build_id }}
          path: /opt
      
      - name: 创建符号链接
        run: |
          sudo mkdir -p /opt/build
          sudo chmod -R 777 /opt/build
          sudo mkdir -p /data/data/com.winlator/files/imagefs/usr
          sudo mkdir -p /data/data/com.winlator/files/imagefs/tmp
          sudo chmod -R 777 /data/data/com.winlator/files/imagefs
      
      - name: 下载 Linux 头文件
        run: |
          cd /opt
          sudo wget -q https://www.kernel.org/pub/linux/kernel/v6.x/linux-6.18.7.tar.xz
          sudo tar xf linux-6.18.7.tar.xz
          cd linux-6.18.7
          sudo make mrproper
          sudo make headers_install ARCH=arm64 INSTALL_HDR_PATH=/opt/tools
          sudo rm -rf /opt/tools/include/drm
      
      - name: 构建 linux-api-headers
        run: |
          cd /opt
          sudo wget -q https://www.kernel.org/pub/linux/kernel/v6.x/linux-6.1.82.tar.xz
          sudo tar xf linux-6.1.82.tar.xz
          cd linux-6.1.82
          sudo make headers_install ARCH=arm64 INSTALL_HDR_PATH=/data/data/com.winlator/files/imagefs/usr

  build-glibc:
    name: 构建 Glibc
    runs-on: ubuntu-24.04
    needs: build-core-libraries
    
    steps:
      - name: 准备环境
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows/scripts/glibc.yml
      
      - name: 准备构建环境
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          sudo mkdir -p /opt/build
          sudo chmod -R 777 /opt/build
          sudo mkdir -p /data/data/com.winlator/files/imagefs/usr
          sudo mkdir -p /data/data/com.winlator/files/imagefs/tmp
          sudo chmod -R 777 /data/data/com.winlator/files/imagefs
          cd /opt
          sudo git clone https://github.com/termux-pacman/glibc-packages.git || sudo git -C glibc-packages pull
          sudo git clone https://github.com/moze30/winlator-wcp.git || sudo git -C winlator-wcp pull
      
      - name: 下载 Glibc 源码
        run: |
          cd /opt
          sudo wget -q https://ftp.gnu.org/gnu/libc/glibc-2.42.tar.xz
          sudo tar xf glibc-2.42.tar.xz
      
      - name: 应用补丁
        run: |
          cd /opt/glibc-2.42
          for patch in /opt/glibc-packages/gpkg/glibc/*.patch; do
            if [[ "$patch" != *"set-dirs.patch" ]]; then
              echo "应用补丁: $(basename $patch)"
              sudo patch -p1 < "$patch"
            fi
          done
      
      - name: 复制 Termux 文件
        run: |
          cd /opt/glibc-2.42
          sudo cp /opt/glibc-packages/gpkg/glibc/{shmat.c,shmctl.c,shmdt.c,shmget.c,mprotect.c,syscall.c,fakesyscall*.h,fake_epoll_pwait2.c,setfsuid.c,setfsgid.c} \
            sysdeps/unix/sysv/linux/
          sudo cp /opt/glibc-packages/gpkg/glibc/{android_passwd_group.c,android_passwd_group.h,android_system_user_ids.h} \
            nss/
          sudo cp /opt/glibc-packages/gpkg/glibc/syslog.c misc/
          sudo cp /opt/glibc-packages/gpkg/glibc/{shmem-android.c,shmem-android.h} sysvipc/
      

      - name: 复制 Winlator 文件
        run: |
          cd /opt/glibc-2.42
          sudo cp /opt/winlator-wcp/glibc_patches/{shmat.c,shmctl.c,shmdt.c,shmget.c,android_sysvshm.c,android_sysvshm.h} \
            sysdeps/unix/sysv/linux/
          sudo cp /opt/winlator-wcp/glibc_patches/android_sysvshm.c sysvipc/
          sudo cp /opt/winlator-wcp/glibc_patches/android_sysvshm.h sysvipc/
      
      - name: 生成 android_ids.h
        run: |
          cd /opt/glibc-2.42
          sudo bash /opt/glibc-packages/gpkg/glibc/gen-android-ids.sh \
            /opt/glibc-packages \
            nss/android_ids.h \
            /opt/glibc-packages/gpkg/glibc/android_system_user_ids.h
      
      - name: 删除不兼容文件
        run: |
          cd /opt/glibc-2.42
          sudo rm -f sysdeps/unix/sysv/linux/aarch64/clone3.S
      
      - name: 重命名 syscall.S
        run: |
          cd /opt/glibc-2.42/sysdeps/unix/sysv/linux/aarch64
          sudo mv syscall.S syscallS.S
      
      - name: 下载 disabled-syscall.h
        run: |
          cd /opt/glibc-2.42
          sudo wget -q https://raw.githubusercontent.com/afeimod/winlator-glibc7.1-moze30/main/include/aarch64/disabled-syscall.h \
            -O sysdeps/unix/sysv/linux/aarch64/disabled-syscall.h
      
      - name: 修改 shm-directory.h
        run: |
          cd /opt/glibc-2.42/include
          sudo sed -i 's|#define SHMDIR _PATH_DEV "shm/"|#define SHMDIR "/data/user/0/com.winlator/files/imagefs/tmp/"|' shm-directory.h
      
      - name: 修改 sysvipc/Makefile（configure 前关键步骤）
        run: |
          cd /opt/glibc-2.42
          
          # 确保 android_sysvshm.c 和 .h 在源目录
          if [ ! -f sysvipc/android_sysvshm.c ]; then
            sudo cp winlator-wcp/glibc_patches/android_sysvshm.c sysvipc/
            sudo cp winlator-wcp/glibc_patches/android_sysvshm.h sysvipc/
          fi
          
          # 关键：修改 Makefile.in，让 configure 生成正确的 Makefile
          # 将 android_sysvshm.o 添加到对象列表中
          if [ -f sysvipc/Makefile.in ]; then
            MAKELIST=sysvipc/Makefile.in
            echo "修改 sysvipc/Makefile.in"
          else
            MAKELIST=sysvipc/Makefile
            echo "修改 sysvipc/Makefile"
          fi
          
          # 将 android_sysvshm.o 添加到 shmem-android 之后（新行）
          # 关键：Makefile 对象列表是多行连续，每行以 \ 结尾
          # 需要在 shmem-android \ 行的下一行插入 android_sysvshm
          if grep -q "shmem-android" $MAKELIST; then
            if ! grep -q "android_sysvshm" $MAKELIST; then
              # 使用 sed 在匹配行后追加新行
              # /shmem-android/{ a\xxx } 会在匹配行后插入 xxx
              sudo sed -i '/shmem-android/a\        android_sysvshm \\' $MAKELIST
              echo "已添加 android_sysvshm 到对象列表"
            else
              echo "android_sysvshm 已在对象列表中"
            fi
          fi
          
          # 验证修改
          echo "=== 验证 $MAKELIST 修改 ==="
          grep -n "android_sysvshm\|shmem-android" $MAKELIST || echo "警告: $MAKELIST 可能未正确修改"
      
      - name: 配置 Glibc
        run: |
          cd /opt/glibc-2.42
          sudo mkdir -p build && cd build
          sudo ../configure \
            --prefix=/data/data/com.winlator/files/imagefs/usr \
            --libdir=/data/data/com.winlator/files/imagefs/usr/lib \
            --libexecdir=/data/data/com.winlator/files/imagefs/usr/libexec \
            --includedir=/data/data/com.winlator/files/imagefs/usr/include \
            --host=aarch64-linux-gnu \
            --build=x86_64-linux-gnu \
            --target=aarch64-linux-gnu \
            --with-bugurl=https://github.com/moze30/winlator-glibc/issues \
            --with-pkgversion="GNU libc for Winlator-Glibc" \
            --enable-bind-now \
            --enable-fortify-source \
            --disable-multi-arch \
            --enable-stack-protector=strong \
            --disable-systemtap \
            --disable-nscd \
            --disable-profile \
            --disable-werror \
            --disable-default-pie \
            --enable-memory-tagging
      
      - name: 编译 Glibc
        run: |
          cd /opt/glibc-2.42/build
          sudo make -j$(nproc)
      
      - name: 安装 Glibc
        run: |
          cd /opt/glibc-2.42/build
          sudo make install DESTDIR=$PWD/package
          sudo tar -czf /opt/build/glibc.tar.gz -C package .
      
      - name: 配置语言环境
        if: env.BUILD_LOCALE == 'zh_CN'
        run: |
          echo "配置中文语言环境..."
          # 设置中文 locale
          echo "zh_CN.UTF-8 UTF-8" | sudo tee -a /etc/locale.gen
          echo "en_US.UTF-8 UTF-8" | sudo tee -a /etc/locale.gen
          sudo locale-gen
          
          # 创建 locale 目录
          sudo mkdir -p ${INSTALL_PREFIX}/lib/locale
          sudo mkdir -p ${INSTALL_PREFIX}/usr/share/locale
          
          # 生成中文 locale（如果 localedef 可用）
          if command -v localedef &> /dev/null; then
            sudo localedef -i zh_CN -f UTF-8 -c zh_CN.UTF-8 || true
            sudo localedef -i zh_CN -f GBK zh_CN.GBK || true
          fi
          
          # 从 glibc 源码安装中文 locale
          cd /opt/glibc-${GLIBC_VERSION}
          if [ -d localedata ]; then
            sudo make install-locales DESTDIR=$PWD/build/package || true
          fi
          
          echo "中文语言环境配置完成"

      - name: 配置英文语言环境
        if: env.BUILD_LOCALE == 'en_US'
        run: |
          echo "配置英文语言环境..."
          echo "en_US.UTF-8 UTF-8" | sudo tee -a /etc/locale.gen
          sudo locale-gen
          sudo mkdir -p ${INSTALL_PREFIX}/lib/locale
          sudo mkdir -p ${INSTALL_PREFIX}/usr/share/locale
          echo "英文语言环境配置完成"
      
      - name: 上传 Glibc
        uses: actions/upload-artifact@v4
        with:
          name: glibc-package
          path: /opt/build/glibc.tar.gz
          retention-days: 1

  build-locales:
    name: 构建语言支持 (Locales)
    runs-on: ubuntu-24.04
    needs: build-glibc
    
    steps:
      - name: 准备环境
        run: |
          sudo mkdir -p /data/data/com.winlator/files/imagefs/usr
          sudo mkdir -p /data/data/com.winlator/files/imagefs/tmp
          sudo chmod -R 777 /data/data/com.winlator/files/imagefs
      
      - name: 下载构建环境
        uses: actions/download-artifact@v4
        with:
          name: glibc-package
          path: /opt/build
      
      - name: 解压 Glibc
        run: |
          sudo mkdir -p /data/data/com.winlator/files/imagefs/usr
          sudo tar -xzf /opt/build/glibc.tar.gz -C /data/data/com.winlator/files/imagefs/usr
      
      - name: 创建 Locales 目录
        run: |
          sudo mkdir -p /data/data/com.winlator/files/imagefs/usr/lib/locale
          sudo mkdir -p /data/data/com.winlator/files/imagefs/usr/share/i18n/locales
          sudo mkdir -p /data/data/com.winlator/files/imagefs/usr/share/i18n/charmaps
          sudo mkdir -p /data/data/com.winlator/files/imagefs/usr/share/i18n/langinfo
      
      - name: 下载 glibc-localedata
        run: |
          cd /opt
          sudo wget -q https://ftp.gnu.org/gnu/glibc/glibc-2.42.tar.xz
          sudo tar -xf glibc-2.42.tar.xz
          sudo cp -r glibc-2.42/localedata/* /data/data/com.winlator/files/imagefs/usr/lib/locale/
      
      - name: 生成中文 Locales
        run: |
          PREFIX=/data/data/com.winlator/files/imagefs/usr
          
          # 确保目录存在且有正确权限
          sudo mkdir -p $PREFIX/lib/locale
          sudo mkdir -p $PREFIX/etc
          sudo chmod -R 777 $PREFIX/lib/locale
          sudo chmod -R 777 $PREFIX/etc
          
          # 生成 locale-archive 文件（仅包含 locale 名称列表，不是二进制文件）
          printf '%s\n' 'zh_CN.UTF-8' 'zh_CN.GB2312' 'zh_CN.GBK' 'zh_CN.GB18030' \
            'zh_TW.UTF-8' 'zh_TW.Big5' 'zh_HK.UTF-8' 'en_US.UTF-8' 'C.UTF-8' \
            | sudo tee $PREFIX/lib/locale/locale-archive > /dev/null
          
          # 创建 locale.gen 文件
          printf '%s\n' 'en_US.UTF-8 UTF-8' 'en_GB.UTF-8 UTF-8' 'zh_CN.UTF-8 UTF-8' \
            'zh_CN.GB2312 GB2312' 'zh_CN.GBK GBK' 'zh_CN.GB18030 GB18030' \
            'zh_TW.UTF-8 UTF-8' 'zh_TW.Big5 Big5' 'zh_HK.UTF-8 UTF-8' \
            'ja_JP.UTF-8 UTF-8' 'ko_KR.UTF-8 UTF-8' 'de_DE.UTF-8 UTF-8' \
            'fr_FR.UTF-8 UTF-8' 'es_ES.UTF-8 UTF-8' 'ru_RU.UTF-8 UTF-8' \
            'pt_BR.UTF-8 UTF-8' 'C.UTF-8 UTF-8' 'POSIX POSIX' \
            | sudo tee $PREFIX/etc/locale.gen > /dev/null
      
      - name: 创建 locale 支持脚本
        run: |
          PREFIX=/data/data/com.winlator/files/imagefs/usr
          
          # 创建 bin 目录
          sudo mkdir -p $PREFIX/bin
          sudo chmod -R 777 $PREFIX/bin
          
          # 创建 locale 安装脚本
          printf '%s\n' '#!/bin/bash' '# Locales 安装脚本 - 为 Android 环境生成 locale 数据' '' \
            'PREFIX="${PREFIX:-/data/data/com.winlator/files/imagefs/usr}"' \
            'LOCDIR="$PREFIX/lib/locale"' '' \
            'echo "正在生成 locales..."' '' \
            '# 如果有 localedef 工具则使用它' \
            'if command -v localedef &> /dev/null; then' \
            '    # 生成 UTF-8 locales' \
            '    localedef -i en_US -f UTF-8 -A /usr/share/locale/locale.alias $LOCDIR/en_US.UTF-8 2>/dev/null || true' \
            '    localedef -i zh_CN -f UTF-8 -A /usr/share/locale/locale.alias $LOCDIR/zh_CN.UTF-8 2>/dev/null || true' \
            '    localedef -i zh_CN -f GB2312 -A /usr/share/locale/locale.alias $LOCDIR/zh_CN.GB2312 2>/dev/null || true' \
            '    localedef -i zh_CN -f GBK -A /usr/share/locale/locale.alias $LOCDIR/zh_CN.GBK 2>/dev/null || true' \
            '    localedef -i zh_CN -f GB18030 -A /usr/share/locale/locale.alias $LOCDIR/zh_CN.GB18030 2>/dev/null || true' \
            '    localedef -i zh_TW -f UTF-8 -A /usr/share/locale/locale.alias $LOCDIR/zh_TW.UTF-8 2>/dev/null || true' \
            '    localedef -i zh_TW -f Big5 -A /usr/share/locale/locale.alias $LOCDIR/zh_TW.Big5 2>/dev/null || true' \
            '    localedef -i zh_HK -f UTF-8 -A /usr/share/locale/locale.alias $LOCDIR/zh_HK.UTF-8 2>/dev/null || true' \
            '    localedef -i C -f UTF-8 -A /usr/share/locale/locale.alias $LOCDIR/C.UTF-8 2>/dev/null || true' \
            '    echo "Locales 生成完成"' \
            'else' \
            '    echo "警告: localedef 未找到，跳过 locale 生成"' \
            '    echo "请确保系统已有必要的 locale 数据"' \
            'fi' '' \
            '# 设置默认 locale 环境变量' \
            'export LC_ALL=zh_CN.UTF-8' \
            'export LANG=zh_CN.UTF-8' '' \
            'echo "Locale 环境已配置"' \
            | sudo tee $PREFIX/bin/install-locales.sh > /dev/null
          sudo chmod +x $PREFIX/bin/install-locales.sh
      
      - name: 创建 locale.alias 文件
        run: |
          PREFIX=/data/data/com.winlator/files/imagefs/usr
          
          # 创建必要的目录
          sudo mkdir -p $PREFIX/share/locale
          sudo chmod -R 777 $PREFIX/share/locale
          
          printf '%s\n' \
            '# Locale 别名文件 - 支持中文及其他语言' \
            '# This file maps locale names to locale archive names' \
            '' \
            'en_US.UTF-8            en_US.UTF-8' \
            'en_US.utf8             en_US.UTF-8' \
            'en_GB.UTF-8            en_GB.UTF-8' \
            'en_GB.utf8             en_GB.UTF-8' \
            '' \
            'zh_CN.UTF-8            zh_CN.UTF-8' \
            'zh_CN.utf8             zh_CN.UTF-8' \
            'zh_CN                   zh_CN.UTF-8' \
            'chinese                zh_CN.UTF-8' \
            'prc                    zh_CN.UTF-8' \
            '' \
            'zh_CN.GB2312           zh_CN.GB2312' \
            'zh_CN.gb2312           zh_CN.GB2312' \
            'gb2312                 zh_CN.GB2312' \
            'gbk                    zh_CN.GBK' \
            '' \
            'zh_CN.GB18030          zh_CN.GB18030' \
            'gb18030                zh_CN.GB18030' \
            '' \
            'zh_TW.UTF-8            zh_TW.UTF-8' \
            'zh_TW.utf8             zh_TW.UTF-8' \
            'zh_TW                   zh_TW.UTF-8' \
            'taiwan                 zh_TW.UTF-8' \
            '' \
            'zh_TW.Big5             zh_TW.Big5' \
            'zh_TW.big5             zh_TW.Big5' \
            'big5                   zh_TW.Big5' \
            '' \
            'zh_HK.UTF-8            zh_HK.UTF-8' \
            'zh_HK.utf8             zh_HK.UTF-8' \
            'hong_kong              zh_HK.UTF-8' \
            '' \
            'ja_JP.UTF-8            ja_JP.UTF-8' \
            'japanese               ja_JP.UTF-8' \
            '' \
            'ko_KR.UTF-8            ko_KR.UTF-8' \
            'korean                 ko_KR.UTF-8' \
            '' \
            'de_DE.UTF-8            de_DE.UTF-8' \
            'german                 de_DE.UTF-8' \
            '' \
            'fr_FR.UTF-8            fr_FR.UTF-8' \
            'french                 fr_FR.UTF-8' \
            '' \
            'es_ES.UTF-8            es_ES.UTF-8' \
            'spanish                es_ES.UTF-8' \
            '' \
            'ru_RU.UTF-8            ru_RU.UTF-8' \
            'russian                ru_RU.UTF-8' \
            '' \
            'pt_BR.UTF-8            pt_BR.UTF-8' \
            'brazilian              pt_BR.UTF-8' \
            '' \
            'C.UTF-8                C.UTF-8' \
            'POSIX                  POSIX' \
            '' \
            '# 默认映射' \
            'default                 C.UTF-8' \
            | sudo tee $PREFIX/share/locale/locale.alias > /dev/null
      
      - name: 创建中文 locale charmap 文件
        run: |
          PREFIX=/data/data/com.winlator/files/imagefs/usr
          sudo mkdir -p $PREFIX/share/i18n/charmaps
          sudo chmod -R 777 $PREFIX/share/i18n
          
          # 创建 GB2312 charmap
          printf '%s\n' \
            '# GB2312 charmap for Chinese locale' \
            '<code_set_name> GB2312</code_set_name>' \
            '<comment_char> %</comment_char>' \
            '<escape_char> /</escape_char>' \
            '' \
            'CHARMAP' \
            'NUL     \\x00' \
            'SOH     \\x01' \
            'STX     \\x02' \
            'ETX     \\x03' \
            'EOT     \\x04' \
            'ENQ     \\x05' \
            'ACK     \\x06' \
            'BEL     \\x07' \
            'BS      \\x08' \
            'HT      \\x09' \
            'LF      \\x0A' \
            'VT      \\x0B' \
            'FF      \\x0C' \
            'CR      \\x0D' \
            'SO      \\x0E' \
            'SI      \\x0F' \
            'DLE     \\x10' \
            'DC1     \\x11' \
            'DC2     \\x12' \
            'DC3     \\x13' \
            'DC4     \\x14' \
            'NAK     \\x15' \
            'SYN     \\x16' \
            'ETB     \\x17' \
            'CAN     \\x18' \
            'EM      \\x19' \
            'SUB     \\x1A' \
            'ESC     \\x1B' \
            'FS      \\x1C' \
            'GS      \\x1D' \
            'RS      \\x1E' \
            'US      \\x1F' \
            'SP      \\x20' \
            '% Character set mapping' \
            'END CHARMAP' \
            | sudo tee $PREFIX/share/i18n/charmaps/GB2312 > /dev/null
      
      - name: 创建环境变量配置文件
        run: |
          PREFIX=/data/data/com.winlator/files/imagefs/usr
          sudo mkdir -p $PREFIX/etc/profile.d
          sudo chmod -R 777 $PREFIX/etc/profile.d
          printf '%s\n' \
            '# Locale 环境变量配置' \
            '# 支持中文显示' \
            '' \
            '# 默认语言设置' \
            'export LANG=zh_CN.UTF-8' \
            'export LC_ALL=zh_CN.UTF-8' \
            '' \
            '# 支持中文输入输出' \
            'export G_BROKEN_FILENAMES=1' \
            'export LC_CTYPE=zh_CN.UTF-8' \
            'export LC_NUMERIC=C' \
            'export LC_TIME=zh_CN.UTF-8' \
            'export LC_COLLATE=zh_CN.UTF-8' \
            'export LC_MONETARY=zh_CN.UTF-8' \
            'export LC_MESSAGES=POSIX' \
            'export LC_PAPER=zh_CN.UTF-8' \
            'export LC_NAME=zh_CN.UTF-8' \
            'export LC_ADDRESS=zh_CN.UTF-8' \
            'export LC_TELEPHONE=zh_CN.UTF-8' \
            'export LC_MEASUREMENT=zh_CN.UTF-8' \
            'export LC_IDENTIFICATION=zh_CN.UTF-8' \
            '' \
            '# 字符集设置' \
            'export CHARSET=UTF-8' \
            '' \
            '# 提示信息本地化' \
            'export TEXTDOMAIN=coreutils' \
            "export TEXTDOMAINDIR=\$PREFIX/share/locale" \
            | sudo tee $PREFIX/etc/profile.d/locale.sh > /dev/null
          sudo chmod +x $PREFIX/etc/profile.d/locale.sh
      
      - name: 上传 Locales
        uses: actions/upload-artifact@v4
        with:
          name: locales-package
          path: /data/data/com.winlator/files/imagefs/usr
          retention-days: 1

  build-gcc-libs:
    name: 构建 GCC-Libs
    runs-on: ubuntu-24.04
    needs: [setup-build-env, build-locales]
    
    steps:
      - name: 准备环境
        run: |
          sudo mkdir -p /data/data/com.winlator/files/imagefs/usr
          sudo mkdir -p /data/data/com.winlator/files/imagefs/tmp
          sudo chmod -R 777 /data/data/com.winlator/files/imagefs
      
      - name: 安装交叉编译工具链和系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu zlib1g-dev:amd64
          # 创建 aarch64 架构目录并链接 zlib（交叉编译时链接器需要）
          sudo mkdir -p /usr/aarch64-linux-gnu/lib
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libz.so /usr/aarch64-linux-gnu/lib/libz.so
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libz.a /usr/aarch64-linux-gnu/lib/libz.a
      
      - name: 下载构建环境
        uses: actions/download-artifact@v4
        with:
          name: build-env-${{ needs.setup-build-env.outputs.build_id }}
          path: /opt
      
      - name: 构建 libgmp（GCC 依赖）
        run: |
          cd /opt
          sudo wget -q https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz
          sudo tar -xf gmp-6.3.0.tar.xz
          cd gmp-6.3.0
          sudo ./configure \
            --host=aarch64-linux-gnu \
            --build=x86_64-linux-gnu \
            --prefix=/opt/gmp \
            --disable-static \
            --enable-cxx
          sudo make -j$(nproc)
          sudo make install
      
      - name: 构建 libmpfr（GCC 依赖）
        run: |
          cd /opt
          sudo wget -q https://www.mpfr.org/mpfr-4.2.1/mpfr-4.2.1.tar.xz
          sudo tar -xf mpfr-4.2.1.tar.xz
          cd mpfr-4.2.1
          sudo ./configure \
            --host=aarch64-linux-gnu \
            --build=x86_64-linux-gnu \
            --prefix=/opt/mpfr \
            --with-gmp=/opt/gmp \
            --disable-static
          sudo make -j$(nproc)
          sudo make install
      
      - name: 构建 libmpc（GCC 依赖）
        run: |
          cd /opt
          sudo wget -q https://ftp.gnu.org/gnu/mpc/mpc-1.3.1.tar.gz
          sudo tar -xzf mpc-1.3.1.tar.gz
          cd mpc-1.3.1
          sudo ./configure \
            --host=aarch64-linux-gnu \
            --build=x86_64-linux-gnu \
            --prefix=/opt/mpc \
            --with-gmp=/opt/gmp \
            --with-mpfr=/opt/mpfr \
            --disable-static
          sudo make -j$(nproc)
          sudo make install
      
      - name: 下载 GCC 源码
        run: |
          cd /opt
          # 使用GCC 13.2.0（与参考项目的补丁兼容）
          # GCC 14.2.0有c++26支持问题，建议使用稳定的13.2.0版本
          sudo wget -q https://ftp.gnu.org/gnu/gcc/gcc-13.2.0/gcc-13.2.0.tar.xz
          sudo tar -xf gcc-13.2.0.tar.xz
      
      - name: 应用补丁
        run: |
          cd /opt/gcc-13.2.0
          PREFIX=/data/data/com.winlator/files/imagefs/usr
          PATCH_DIR=/opt/winlator-wcp/gcc-libs
          if [ -f ${PATCH_DIR}/set_glibc_dynamic_linker.patch ]; then
            # 确保补丁适用于GCC 13.2.0（补丁文件名是gcc-13.2.0）
            sudo sed -i "s|@TERMUX_PREFIX@|${PREFIX}|g" ${PATCH_DIR}/set_glibc_dynamic_linker.patch
            sudo patch -p1 < ${PATCH_DIR}/set_glibc_dynamic_linker.patch || \
              sudo find gcc/config -name "*.h" -exec sudo sed -i 's|/lib/ld-linux-aarch64|/data/data/com.winlator/files/imagefs/usr/lib/ld-linux-aarch64|g' {} \;
          fi
          sudo sed -i 's@\./fixinc\.sh@-c true@' gcc/Makefile.in
          sudo sed -i '/m64=/s/lib64/lib/' gcc/config/i386/t-linux64
          sudo sed -i '/lp64=/s/lib64/lib/' gcc/config/aarch64/t-aarch64-linux
          # 设置GCC版本为13.2.0（与补丁兼容）
          echo "13.2.0" | sudo tee gcc/BASE-VER
          echo "" | sudo tee gcc/DEV-PHASE
          # GCC 13.2.0不需要c++26修复，使用标准配置即可
      
      - name: 配置 GCC-Libs
        run: |
          cd /opt/gcc-13.2.0
          PREFIX=/data/data/com.winlator/files/imagefs/usr
          sudo mkdir build && cd build
          # 参考项目配置，移除 --with-system-zlib（会导致host工具链接错误）
          sudo ../configure \
            --host=aarch64-linux-gnu \
            --build=x86_64-linux-gnu \
            --target=aarch64-linux-gnu \
            --prefix=${PREFIX} \
            --libdir=${PREFIX}/lib \
            --libexecdir=${PREFIX}/lib \
            --enable-languages=c,c++ \
            --with-arch=armv8-a \
            --disable-multilib \
            --disable-bootstrap \
            --disable-nls \
            --disable-plugin \
            --enable-default-pie \
            --enable-default-ssp \
            --enable-__cxa_atexit \
            --disable-werror \
            --disable-checking \
            --disable-libssp \
            --disable-libstdcxx-pch \
            --with-linker-hash-style=gnu \
            --with-gmp=/opt/gmp \
            --with-mpfr=/opt/mpfr \
            --with-mpc=/opt/mpc \
            LD_FOR_TARGET=aarch64-linux-gnu-ld
      
      - name: 编译安装 GCC-Libs
        run: |
          cd /opt/gcc-13.2.0/build
          sudo make -j$(nproc)
          sudo make install
      
      - name: 上传 GCC-Libs
        uses: actions/upload-artifact@v4
        with:
          name: gcc-libs-package
          path: /data/data/com.winlator/files/imagefs/usr
          retention-days: 1

  build-zlib:
    name: 构建 Zlib
    runs-on: ubuntu-24.04
    needs: build-gcc-libs
    
    steps:
      - name: 准备环境
        run: |
          sudo mkdir -p /data/data/com.winlator/files/imagefs/usr
          sudo mkdir -p /data/data/com.winlator/files/imagefs/tmp
          sudo chmod -R 777 /data/data/com.winlator/files/imagefs
      
      - name: 下载构建环境
        uses: actions/download-artifact@v4
        with:
          name: gcc-libs-package
          path: /data/data/com.winlator/files/imagefs/usr
      
      - name: 下载 Zlib 源码
        run: |
          cd /opt
          sudo wget -q https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
          sudo tar -xzf zlib-1.3.1.tar.gz
      
      - name: 配置编译 Zlib
        run: |
          cd /opt/zlib-1.3.1
          export CC=aarch64-linux-gnu-gcc
          export AR=aarch64-linux-gnu-ar
          export RANLIB=aarch64-linux-gnu-ranlib
          sudo mkdir -p /opt/build
          sudo chmod -R 777 /opt/build
          sudo ./configure --prefix=/data/data/com.winlator/files/imagefs/usr
          sudo make -j$(nproc)
          sudo make install DESTDIR=$PWD/package
          sudo tar -czf /opt/build/zlib.tar.gz -C package .
      
      - name: 上传 Zlib
        uses: actions/upload-artifact@v4
        with:
          name: zlib-package
          path: /opt/build/zlib.tar.gz
          retention-days: 1

  build-basic-libraries:
    name: 构建基础库
    runs-on: ubuntu-24.04
    needs: build-zlib
    
    steps:
      - name: 准备环境
        run: |
          # 安装交叉编译工具链（关键依赖）
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu
          # 创建工作目录
          sudo mkdir -p /data/data/com.winlator/files/imagefs/usr
          sudo mkdir -p /data/data/com.winlator/files/imagefs/tmp
          sudo chmod -R 777 /data/data/com.winlator/files/imagefs
          # 验证交叉编译器已安装
          which aarch64-linux-gnu-gcc && echo "Cross-compiler installed successfully"
      
      - name: 下载构建环境
        uses: actions/download-artifact@v4
        with:
          name: zlib-package
          path: /opt/build
      
      - name: 解压之前的构建
        run: |
          cd /opt/build
          for pkg in glibc gcc-libs zlib; do
            if [ -f "${pkg}.tar.gz" ]; then
              sudo mkdir -p /data/data/com.winlator/files/imagefs/usr
              sudo tar -xzf ${pkg}.tar.gz -C /data/data/com.winlator/files/imagefs/usr 2>/dev/null || true
            fi
          done
      
      - name: 构建 libffi
        run: |
          cd /opt
          sudo wget -q https://github.com/libffi/libffi/releases/download/v3.4.7/libffi-3.4.7.tar.gz
          sudo tar xf libffi-3.4.7.tar.gz
          cd libffi-3.4.7
          sudo ./configure \
            --prefix=/data/data/com.winlator/files/imagefs/usr \
            --host=aarch64-linux-gnu \
            --build=x86_64-linux-gnu \
            --disable-multi-os-directory \
            --disable-exec-static-tramp \
            --enable-pax_emutramp
          sudo make -j$(nproc)
          sudo make install
      
      - name: 构建 ncurses
        run: |
          cd /opt
          sudo wget -q https://ftp.gnu.org/gnu/ncurses/ncurses-6.5.tar.gz
          sudo tar -xzf ncurses-6.5.tar.gz
          cd ncurses-6.5
          # 使用交叉编译器编译 ncurses（构建 ARM64 目标库）
          # 设置环境变量确保 configure 和 make 都使用交叉编译器
          export CC=aarch64-linux-gnu-gcc
          export CXX=aarch64-linux-gnu-g++
          export AR=aarch64-linux-gnu-ar
          export RANLIB=aarch64-linux-gnu-ranlib
          sudo ./configure \
            --host=aarch64-linux-gnu \
            --build=x86_64-linux-gnu \
            --prefix=/data/data/com.winlator/files/imagefs/usr \
            --disable-root-access \
            --disable-root-environ \
            --disable-setuid-environ \
            --enable-widec \
            --enable-pc-files \
            --with-shared \
            --with-cxx-binding \
            --with-versioned-syms \
            --with-pkg-config-libdir=/data/data/com.winlator/files/imagefs/usr/lib/pkgconfig \
            --with-xterm-kbs=del \
            --without-ada \
            --without-strip \
            --mandir=/data/data/com.winlator/files/imagefs/usr/share/man
          sudo env "PATH=/usr/bin:/bin:/usr/local/bin:$PATH" make -j$(nproc)
          sudo env "PATH=/usr/bin:/bin:/usr/local/bin:$PATH" make install
          sudo env "PATH=/usr/bin:/bin:/usr/local/bin:$PATH" sed -i 's/^INSTALL_PROG\s*=.*/INSTALL_PROG = $(INSTALL)/' progs/Makefile
          
          DEST=/data/data/com.winlator/files/imagefs
          PREF=$DEST/usr
          for lib in ncurses ncurses++ form panel menu; do
            printf "INPUT(-l%sw)\n" "${lib}" | sudo tee $PREF/lib/lib${lib}.so
            sudo ln -svf ${lib}w.pc $PREF/lib/pkgconfig/${lib}.pc
          done
          printf 'INPUT(-lncursesw)\n' | sudo tee $PREF/lib/libcursesw.so
          sudo ln -svf libncurses.so $PREF/lib/libcurses.so
          VER_MAJOR=6
          for lib in tic tinfo; do
            printf "INPUT(libncursesw.so.%s)\n" "$VER_MAJOR" | sudo tee $PREF/lib/lib${lib}.so
            sudo ln -svf libncursesw.so.${VER_MAJOR} $PREF/lib/lib${lib}.so.${VER_MAJOR}
            sudo ln -svf ncursesw.pc $PREF/lib/pkgconfig/${lib}.pc
          done
          sudo mkdir -p $PREF/include/ncurses
          for i in $PREF/include/ncursesw/*; do
            sudo mv ${i} $PREF/include/
            sudo ln -s ../$(basename ${i}) $PREF/include/ncurses/
            sudo ln -s ../$(basename ${i}) $PREF/include/ncursesw/
          done
      
      - name: 构建 readline
        run: |
          cd /opt
          sudo wget -q https://ftp.gnu.org/gnu/readline/readline-8.2.tar.gz
          sudo tar -xzf readline-8.2.tar.gz
          cd readline-8.2
          PATCH_BASE="https://ftp.gnu.org/gnu/readline/readline-8.2-patches"
          for num in 001 002 003 004 005 006 007 008 009 010 011 012 013; do
            sudo wget -q "${PATCH_BASE}/readline82-${num}"
            sudo patch -p0 < "readline82-${num}"
          done
          sudo sed -i 's|-Wl,-rpath,$(libdir) ||g' support/shobj-conf
          # 明确设置交叉编译器，确保使用 aarch64-linux-gnu 工具链
          sudo CC=aarch64-linux-gnu-gcc CXX=aarch64-linux-gnu-g++ ./configure \
            --host=aarch64-linux-gnu \
            --build=x86_64-linux-gnu \
            --prefix=/data/data/com.winlator/files/imagefs/usr \
            --disable-static \
            --with-curses \
            CPPFLAGS="-I/data/data/com.winlator/files/imagefs/usr/include" \
            LDFLAGS="-L/data/data/com.winlator/files/imagefs/usr/lib"
          sudo make -j$(nproc) SHLIB_LIBS="-lncurses"
          sudo make install INSTALL_PROGRAM="/usr/bin/install -c"
      
      - name: 构建 openssl
        run: |
          cd /opt
          sudo wget -q https://github.com/openssl/openssl/releases/download/openssl-3.4.1/openssl-3.4.1.tar.gz
          sudo tar -xf openssl-3.4.1.tar.gz
          cd openssl-3.4.1
          # 设置PATH确保交叉编译器可用
          export PATH="/usr/bin:/bin:/usr/local/bin:/usr/aarch64-linux-gnu/bin:$PATH"
          # 明确设置交叉编译器环境变量，确保构建工具链正确
          export CC=aarch64-linux-gnu-gcc
          export CXX=aarch64-linux-gnu-g++
          export AR=aarch64-linux-gnu-ar
          export LD=aarch64-linux-gnu-ld
          export RANLIB=aarch64-linux-gnu-ranlib
          export CROSS_COMPILE=aarch64-linux-gnu-
          # 确认交叉编译器存在
          which aarch64-linux-gnu-gcc || ls -la /usr/bin/aarch64-linux-gnu-gcc || ls -la /usr/aarch64-linux-gnu/bin/*
          sudo ./Configure linux-aarch64 \
            --prefix=/data/data/com.winlator/files/imagefs/usr \
            --openssldir=/data/data/com.winlator/files/imagefs/usr/etc/ssl \
            --libdir=/data/data/com.winlator/files/imagefs/usr/lib \
            shared \
            enable-ktls \
            no-afalgeng
          # 修改Makefile中的工具链变量，使用绝对路径
          sudo sed -i 's|^CC=|CC=|' Makefile
          sudo sed -i 's|^CC=.*|CC= /usr/bin/aarch64-linux-gnu-gcc|' Makefile
          sudo sed -i 's|^AR=.*|AR= /usr/bin/aarch64-linux-gnu-ar|' Makefile
          sudo sed -i 's|^AS=.*|AS= /usr/bin/aarch64-linux-gnu-as|' Makefile
          sudo sed -i 's|^LD=.*|LD= /usr/bin/aarch64-linux-gnu-ld|' Makefile
          sudo sed -i 's|^NM=.*|NM= /usr/bin/aarch64-linux-gnu-nm|' Makefile
          sudo sed -i 's|^RANLIB=.*|RANLIB= /usr/bin/aarch64-linux-gnu-ranlib|' Makefile
          sudo sed -i 's|^STRIP=.*|STRIP= /usr/bin/aarch64-linux-gnu-strip|' Makefile
          sudo sed -i 's|^CROSS_COMPILE=.*|CROSS_COMPILE=aarch64-linux-gnu-|' Makefile
          # 使用绝对路径执行 make
          sudo env "PATH=/usr/bin:/bin:/usr/local/bin:/usr/aarch64-linux-gnu/bin:$PATH" make depend
          sudo env "PATH=/usr/bin:/bin:/usr/local/bin:/usr/aarch64-linux-gnu/bin:$PATH" make -j$(nproc)
          sudo env "PATH=/usr/bin:/bin:/usr/local/bin:/usr/aarch64-linux-gnu/bin:$PATH" make install \
            MANDIR=/data/data/com.winlator/files/imagefs/usr/share/man \
            MANSUFFIX=ssl \
            install_sw install_ssldirs install_man_docs
      
      - name: 上传基础库
        uses: actions/upload-artifact@v4
        with:
          name: basic-libraries-package
          path: /data/data/com.winlator/files/imagefs/usr
          retention-days: 1

  build-compression-libraries:
    name: 构建压缩库
    runs-on: ubuntu-24.04
    needs: build-basic-libraries
    
    steps:
      - name: 准备环境
        run: |
          sudo mkdir -p /data/data/com.winlator/files/imagefs/usr
          sudo mkdir -p /data/data/com.winlator/files/imagefs/tmp
          sudo chmod -R 777 /data/data/com.winlator/files/imagefs
      
      - name: 下载构建环境
        uses: actions/download-artifact@v4
        with:
          name: basic-libraries-package
          path: /data/data/com.winlator/files/imagefs/usr
      
      - name: 构建 libbz2
        run: |
          cd /opt
          sudo wget -q https://sourceware.org/pub/bzip2/bzip2-1.0.8.tar.gz
          sudo tar -xzf bzip2-1.0.8.tar.gz
          cd bzip2-1.0.8
          sudo make -f Makefile-libbz2_so CC=aarch64-linux-gnu-gcc
          sudo make install PREFIX=/data/data/com.winlator/files/imagefs/usr
      
      - name: 构建 liblzma
        run: |
          cd /opt
          sudo wget -q https://tukaani.org/xz/xz-5.6.3.tar.gz
          sudo tar -xzf xz-5.6.3.tar.gz
          cd xz-5.6.3
          sudo ./configure \
            --host=aarch64-linux-gnu \
            --build=x86_64-linux-gnu \
            --prefix=/data/data/com.winlator/files/imagefs/usr \
            --disable-static
          sudo make -j$(nproc)
          sudo make install INSTALL_PROGRAM="/usr/bin/install -c"
      
      - name: 构建 liblz4
        run: |
          cd /opt
          sudo wget -q https://github.com/lz4/lz4/releases/download/v1.10.0/lz4-1.10.0.tar.gz
          sudo tar -xzf lz4-1.10.0.tar.gz
          cd lz4-1.10.0
          sudo make -j$(nproc) CC=aarch64-linux-gnu-gcc PREFIX=/data/data/com.winlator/files/imagefs/usr DESTDIR=$PWD/package install
          sudo tar -czf /opt/build/liblz4.tar.gz -C package .
      
      - name: 构建 zstd
        run: |
          cd /opt
          sudo wget -q https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz
          sudo tar -xzf zstd-1.5.7.tar.gz
          cd zstd-1.5.7
          sudo make -j$(nproc) CC=aarch64-linux-gnu-gcc PREFIX=/data/data/com.winlator/files/imagefs/usr DESTDIR=$PWD/package install
          sudo tar -czf /opt/build/zstd.tar.gz -C package .
      
      - name: 构建 brotli
        run: |
          cd /opt
          sudo git clone https://github.com/google/brotli.git
          cd brotli
          sudo mkdir build && cd build
          sudo cmake .. -DCMAKE_TOOLCHAIN_FILE=/opt/build/toolchain-aarch64.cmake \
            -DCMAKE_INSTALL_PREFIX=/data/data/com.winlator/files/imagefs/usr \
            -DBUILD_SHARED_LIBS=ON
          sudo make -j$(nproc)
          sudo make install
      
      - name: 上传压缩库
        uses: actions/upload-artifact@v4
        with:
          name: compression-libraries-package
          path: /data/data/com.winlator/files/imagefs/usr
          retention-days: 1

  build-crypto-libraries:
    name: 构建加密库
    runs-on: ubuntu-24.04
    needs: build-compression-libraries
    
    steps:
      - name: 准备环境
        run: |
          sudo mkdir -p /data/data/com.winlator/files/imagefs/usr
          sudo mkdir -p /data/data/com.winlator/files/imagefs/tmp
          sudo chmod -R 777 /data/data/com.winlator/files/imagefs
      
      - name: 下载构建环境
        uses: actions/download-artifact@v4
        with:
          name: compression-libraries-package
          path: /data/data/com.winlator/files/imagefs/usr
      
      - name: 构建 libgmp
        run: |
          cd /opt
