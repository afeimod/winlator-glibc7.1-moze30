name: Proton ARM64EC 构建（Winlator 专用版）

on:
  workflow_dispatch:
    inputs:
      proton_branch:
        description: 'Proton 分支'
        required: false
        default: 'proton_10.0'
        type: choice
        options:
          - proton_10.0
          - proton_9.0
          - experimental_10.0
          - bleeding-edge

env:
  # Winlator 专用路径配置 - 仅 com.winlator 路径
  WINLATOR_TMP_DIR: /data/data/com.winlator/files/imagefs/usr/tmp
  WINLATOR_RUNTIME_PATH: /data/data/com.winlator/files/imagefs/usr
  WINLATOR_INSTALL_PATH: /data/data/com.winlator/files/imagefs/usr/opt/wine
  APP_ID: com.winlator

  # Android NDK 版本
  ANDROID_NDK_VERSION: r27c

permissions:
  contents: write

jobs:
  build-proton-arm64ec-winlator:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # ------------------------------------------------------------
      # 1. 检查代码库并清理磁盘空间
      # ------------------------------------------------------------
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 清理磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      # ------------------------------------------------------------
      # 2. 安装基础构建依赖
      # ------------------------------------------------------------
      - name: 安装构建依赖
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            wget \
            curl \
            unzip \
            python3 \
            python3-pip \
            python3-zstandard \
            xz-utils \
            zstd

      # ------------------------------------------------------------
      # 3. 下载 Android NDK
      # ------------------------------------------------------------
      - name: 下载 Android NDK
        run: |
          NDK_DIR="$HOME/android-ndk-${{ env.ANDROID_NDK_VERSION }}"
          if [ ! -d "$NDK_DIR" ]; then
            echo "下载 Android NDK..."
            mkdir -p "$HOME"
            cd "$HOME"
            wget -q "https://dl.google.com/android/repository/android-ndk-${{ env.ANDROID_NDK_VERSION }}-linux.zip"
            unzip -q "android-ndk-${{ env.ANDROID_NDK_VERSION }}-linux.zip"
            rm -f "android-ndk-${{ env.ANDROID_NDK_VERSION }}-linux.zip"
          else
            echo "Android NDK 已存在，跳过下载"
          fi
          echo "NDK_DIR=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV

      # ------------------------------------------------------------
      # 4. 获取 Proton 源码
      # ------------------------------------------------------------
      - name: 克隆 Wine 源码
        run: |
          rm -rf wine-source
          PROTON_BRANCH="${{ github.event.inputs.proton_branch || 'proton_10.0' }}"
          
          # 克隆 GameNative/proton-wine
          git clone --depth=1 --branch "$PROTON_BRANCH" \
            https://github.com/GameNative/proton-wine wine-source \
            || {
              echo "GameNative 仓库克隆失败，回退到 ValveSoftware/wine"
              git clone --depth=1 --branch "$PROTON_BRANCH" \
                https://github.com/ValveSoftware/wine wine-source \
                || {
                  git clone --depth=1 https://github.com/ValveSoftware/wine wine-source
                  git -C wine-source fetch --depth=1 origin "$PROTON_BRANCH"
                  git -C wine-source checkout FETCH_HEAD
                }
            }
          
          echo "Proton 分支: $PROTON_BRANCH"
          git -C wine-source rev-parse HEAD

      # ------------------------------------------------------------
      # 5. 应用构建脚本和必要补丁
      # ------------------------------------------------------------
      - name: 应用构建脚本和补丁
        run: |
          cd wine-source
          
          # 复制补丁目录
          if [ -d "../proton-arm64-nightlies-main/android" ]; then
            cp -r ../proton-arm64-nightlies-main/android .
            echo "补丁目录已复制"
          fi
          
          # 复制 GE Second Pass 补丁
          if [ -d "../proton-arm64-nightlies-main/ge-second-pass" ]; then
            cp -r ../proton-arm64-nightlies-main/ge-second-pass .
            echo "GE Second Pass 补丁已复制"
          fi
          
          # 复制必要脚本
          if [ -d "../proton-arm64-nightlies-main/scripts" ]; then
            cp -r ../proton-arm64-nightlies-main/scripts .
            echo "构建辅助脚本已复制"
          fi
          
          # 【关键修复】确保 test-bylaws 补丁存在
          echo "=== 检查并复制 test-bylaws 补丁 ==="
          mkdir -p android/patches/test-bylaws
          
          # 从 ge-second-pass/test-bylaws 复制所有 test-bylaws 补丁
          if [ -d "ge-second-pass/test-bylaws" ]; then
            echo "从 ge-second-pass/test-bylaws 复制补丁..."
            cp ge-second-pass/test-bylaws/*.patch android/patches/test-bylaws/ 2>/dev/null || echo "ge-second-pass/test-bylaws 为空"
            cp ge-second-pass/test-bylaws/*.patch android/patches/ 2>/dev/null || true
          fi
          
          # 修复行尾符
          find android/patches -type f -name "*.patch" -exec sed -i 's/\r$//' {} + 2>/dev/null || true

      # ------------------------------------------------------------
      # 6. 修复源码中的 tmp 路径为 Winlator 专用路径
      # ------------------------------------------------------------
      - name: 修复源码 tmp 路径
        run: |
          cd wine-source
          
          echo "=== 修复 Winlator tmp 路径问题 ==="
          # 使用 yml 中定义的 tmp 路径
          WINLATOR_TMP_DIR="/data/data/com.winlator/files/imagefs/usr/tmp"
          
          # 修复源码中的 tmp 路径
          find . -type f \( -name "*.c" -o -name "*.h" -o -name "*.in" -o -name "*.spec" \) -exec grep -l "/tmp" {} \; 2>/dev/null | while read file; do
            sed -i "s|/tmp/|$WINLATOR_TMP_DIR/|g" "$file"
            echo "已修改: $file"
          done
          
          echo "=== tmp 路径修复完成 ==="

      # ------------------------------------------------------------
      # 7. 【关键】修复 Wine 源码中的 IDL 文件问题（在 make_makefiles 之前）
      # ------------------------------------------------------------
      # 注意：这个步骤必须在"准备 Wine 构建系统"步骤（步骤 9）之前执行
      # 原因：make_makefiles 会检查所有 .idl 文件是否包含 @makedep 标志
      # 如果缺少该标志，会导致构建失败
      - name: 修复 IDL 文件问题
        run: |
          cd wine-source
          
          echo "=== 修复 Wine 源码中的 IDL 文件问题 ==="
          echo "【重要】此步骤必须在 make_makefiles 之前执行！"
          
          # 【方法1】直接删除有问题的 IDL 文件（推荐）
          # amd_ags_x64 是一个可选的 DLL，很多构建不需要它
          if [ -f "dlls/amd_ags_x64/dxvk_interfaces.idl" ]; then
            echo "方案1: 删除 dlls/amd_ags_x64/ 目录（避免 makedep 问题）"
            rm -rf dlls/amd_ags_x64/
            echo "已删除 amd_ags_x64 目录"
          fi
          
          # 【方法2】如果目录无法删除，修改 IDL 文件
          if [ -f "dlls/amd_ags_x64/dxvk_interfaces.idl" ]; then
            echo "方案2: 修改 IDL 文件添加 makedep 标志..."
            if ! head -5 "dlls/amd_ags_x64/dxvk_interfaces.idl" | grep -q "@makedep"; then
              sed -i '1i/* @makedep(ignore) */' dlls/amd_ags_x64/dxvk_interfaces.idl
              echo "已添加 @makedep(ignore) 到 dxvk_interfaces.idl"
            fi
          fi
          
          # 【方法3】查找并修复所有缺少 makedep 标志的 IDL 文件
          echo "=== 检查其他 IDL 文件 ==="
          if [ -d "dlls" ]; then
            find dlls -name "*.idl" -type f 2>/dev/null | while read idl_file; do
              if ! grep -q "@makedep" "$idl_file" 2>/dev/null; then
                echo "修复缺少 makedep 的文件: $idl_file"
                sed -i '1i/* @makedep(ignore) */' "$idl_file" 2>/dev/null || true
              fi
            done
          fi
          
          echo "=== IDL 文件修复完成 ==="
          echo "现在可以安全地运行 make_requests 和 make_makefiles"

      # ------------------------------------------------------------
      # 8. 验证所有必需的补丁文件存在
      # ------------------------------------------------------------
      - name: 验证补丁文件
        run: |
          cd wine-source
          echo "=== 验证 android/patches 目录结构 ==="
          ls -la android/patches/
          echo ""
          echo "=== 验证 test-bylaws 补丁 ==="
          ls -la android/patches/test-bylaws/ 2>/dev/null || echo "test-bylaws 目录不存在或为空"
          echo ""
          echo "=== 检查关键补丁文件是否存在 ==="
          for patch in \
            "test-bylaws/dlls_ntdll_signal_arm64ec_c.patch" \
            "test-bylaws/dlls_wow64_syscall_c.patch"; do
            if [ -f "android/patches/$patch" ]; then
              echo "✓ android/patches/$patch 存在"
            else
              echo "✗ android/patches/$patch 不存在!"
            fi
          done

      # ------------------------------------------------------------
      # 9. 准备 Wine 构建系统
      # ------------------------------------------------------------
      - name: 准备 Wine 构建系统
        run: |
          cd wine-source
          ./tools/make_requests
          ./tools/make_specfiles
          ./tools/make_makefiles
          autoreconf -f

      # ------------------------------------------------------------
      # 10. 配置 ARM64 Android 交叉编译（使用 NDK）
      # ------------------------------------------------------------
      - name: 配置 ARM64 Android 交叉编译
        id: configure_build
        continue-on-error: true
        run: |
          cd wine-source
          set -o pipefail
          
          # 【关键】设置 Android NDK 工具链
          export NDK_PATH="$HOME/android-ndk-${{ env.ANDROID_NDK_VERSION }}"
          export TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export TARGET="aarch64-linux-android28"
          
          # 设置编译器
          export CC="${TOOLCHAIN}/${TARGET}-clang"
          export CXX="${TOOLCHAIN}/${TARGET}-clang++"
          export AR="${TOOLCHAIN}/llvm-ar"
          export STRIP="${TOOLCHAIN}/llvm-strip"
          export RANLIB="${TOOLCHAIN}/llvm-ranlib"
          
          echo "=== NDK 工具链信息 ==="
          echo "NDK_PATH: $NDK_PATH"
          echo "TOOLCHAIN: $TOOLCHAIN"
          echo "CC: $CC"
          echo ""
          
          # 验证编译器存在
          if [ ! -f "$CC" ]; then
            echo "错误: 编译器不存在: $CC"
            ls -la "$TOOLCHAIN/"
            exit 1
          fi
          echo "[OK] 编译器版本: $($CC --version | head -1)"
          
          # 【关键】在配置构建参数前设置 LDFLAGS
          echo "=== 设置 LDFLAGS ==="
          export LDFLAGS="-s -Wl,--dynamic-linker=/data/data/com.winlator/files/imagefs/usr/lib/ld-linux-aarch64.so.1 -Wl,-rpath=/data/data/com.winlator/files/imagefs/usr/lib"
          echo "LDFLAGS: $LDFLAGS"
          echo ""
          
          # 创建构建目录
          mkdir -p wine-tools
          mkdir -p wine-build/target
          
          # 配置 host wine-tools
          echo "=== 配置 host wine-tools ==="
          cd wine-tools
          env -u CC -u CXX \
            ../configure \
            --enable-win64 \
            --without-x \
            --without-freetype \
            --without-gnutls \
            --without-unwind \
            --without-pulse \
            --without-gstreamer \
            --without-alsa \
            --without-sdl \
            --without-vulkan \
            --without-cups \
            --without-krb5 \
            --without-netapi \
            --without-gphoto \
            --without-udev \
            --without-capi \
            --without-ffmpeg \
            2>&1 | tee configure-tools.log
          
          cd ../wine-build/target
          
          # 【关键】配置 ARM64 Android 目标
          echo "=== 配置 ARM64 Android 目标 ==="
          # Winlator 专用路径 - 仅 com.winlator
          export WINLATOR_INSTALL_PATH="/data/data/com.winlator/files/imagefs/usr/opt/wine"
          
          "$SOURCE_DIR/configure" \
            --host=aarch64-linux-android \
            --with-wine-tools="$BUILD_DIR/tools" \
            --prefix="$WINLATOR_INSTALL_PATH" \
            --bindir=bin \
            --libdir=lib \
            --enable-archs=aarch64,i386 \
            --without-x \
            --without-freetype \
            --without-gnutls \
            --without-unwind \
            --without-dbus \
            --without-sane \
            --without-netapi \
            --without-pulse \
            --without-gstreamer \
            --without-alsa \
            --without-sdl \
            --without-vulkan \
            --without-cups \
            --without-krb5 \
            --without-gphoto \
            --without-udev \
            --without-capi \
            --without-ffmpeg \
            CC="$CC" \
            CXX="$CXX" \
            AR="$AR" \
            STRIP="$STRIP" \
            RANLIB="$RANLIB" \
            TARGETCC="$CC" \
            TARGETCXX="$CXX" \
            CFLAGS="-O2 -DANDROID -fPIC" \
            LDFLAGS="$LDFLAGS" \
            2>&1 | tee configure-target.log
          
          test -f Makefile

      - name: 显示配置错误日志
        if: steps.configure_build.outcome == 'failure'
        run: |
          cd wine-source/wine-build/target
          echo "配置失败，显示日志:"
          if [ -f ./configure-target.log ]; then
            tail -n 250 ./configure-target.log || true
          fi
          if [ -f ./config.log ]; then
            tail -n 250 ./config.log || true
          fi
          exit 1

      # ------------------------------------------------------------
      # 11. 构建 host wine-tools
      # ------------------------------------------------------------
      - name: 构建 host wine-tools
        run: |
          cd wine-source/wine-tools
          make -j$(nproc) __tooldeps__
          echo "wine-tools 构建完成"

      # ------------------------------------------------------------
      # 12. 构建 Wine ARM64
      # ------------------------------------------------------------
      - name: 构建 Wine ARM64
        run: |
          cd wine-source/wine-build/target
          
          echo "=== 开始构建 Wine ARM64 ==="
          echo "LDFLAGS: $LDFLAGS"
          
          make -j$(nproc) 2>&1 | tee build-run.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "构建失败，显示最后 200 行日志："
            tail -n 200 build-run.log
            exit 1
          fi

      # ------------------------------------------------------------
      # 13. 安装 Wine
      # ------------------------------------------------------------
      - name: 安装 Wine
        run: |
          cd wine-source/wine-build/target
          
          # 创建安装目录
          INSTALL_DIR="$PWD/install"
          rm -rf "$INSTALL_DIR"
          mkdir -p "$INSTALL_DIR"
          
          # 安装到 staging 目录
          make install DESTDIR="$INSTALL_DIR"
          
          # 重新组织目录结构以匹配 Winlator 预期布局
          # make install 将文件放在 prefix 下; 展平为 bin/ lib/ share/
          WINE_PREFIX_INNER="$INSTALL_DIR/data/data/com.winlator/files/imagefs/usr/opt/wine"
          if [ -d "$WINE_PREFIX_INNER" ]; then
            cp -r "$WINE_PREFIX_INNER/." "$INSTALL_DIR/"
            rm -rf "$INSTALL_DIR/data"
          fi
          
          echo "=== 安装目录内容 ==="
          ls -la "$INSTALL_DIR"
          
          # 验证二进制文件
          echo "=== wine 二进制文件类型 ==="
          file "$INSTALL_DIR/bin/wine" 2>/dev/null || echo "找不到 wine 二进制文件"
          
          # 验证动态链接器
          echo "=== 验证 wine 动态链接器 ==="
          readelf -l "$INSTALL_DIR/bin/wine" 2>/dev/null | grep -i interpreter || true
          
          # 保存安装目录路径
          echo "INSTALL_DIR=$INSTALL_DIR" >> $GITHUB_ENV

      # ------------------------------------------------------------
      # 14. 剥离调试符号
      # ------------------------------------------------------------
      - name: 剥离调试符号
        run: |
          NDK_PATH="$HOME/android-ndk-${{ env.ANDROID_NDK_VERSION }}"
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          STRIP="${TOOLCHAIN}/llvm-strip"
          
          INSTALL_DIR="${{ env.INSTALL_DIR }}"
          echo "=== 剥离调试符号 ==="
          find "$INSTALL_DIR/lib/wine/aarch64-unix" -name "*.so" -exec "$STRIP" --strip-debug {} \; 2>/dev/null || true
          "$STRIP" --strip-debug "$INSTALL_DIR/bin/wine" "$INSTALL_DIR/bin/wineserver" 2>/dev/null || true
          echo "剥离完成"

      # ------------------------------------------------------------
      # 15. 打包 wine 内容
      # ------------------------------------------------------------
      - name: 打包 wine 内容
        run: |
          GIT_HASH=$(git -C wine-source rev-parse --short HEAD)
          GIT_DATE=$(git -C wine-source log -1 --format='%cd' --date=format:'%Y%m%d')
          PROTON_BRANCH="${{ github.event.inputs.proton_branch || 'proton_10.0' }}"
          VERSION="proton-${PROTON_BRANCH}-${GIT_DATE}-${GIT_HASH}-winlator-arm64ec"
          
          mkdir -p "$GITHUB_WORKSPACE/output"
          
          echo "打包目录: ${{ env.INSTALL_DIR }}"
          ls -la "${{ env.INSTALL_DIR }}/"
          
          # 直接打包 wine 内容（bin lib share）
          cd "${{ env.INSTALL_DIR }}"
          tar cJf "$GITHUB_WORKSPACE/output/proton-${VERSION}.tar.xz" \
            bin lib share
          
          cd "$GITHUB_WORKSPACE"
          sha256sum "output/proton-${VERSION}.tar.xz" > "output/proton-${VERSION}.tar.xz.sha256"
          
          ls -lh output/

      # ------------------------------------------------------------
      # 16. 上传构建产物
      # ------------------------------------------------------------
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Proton-${{ github.event.inputs.proton_branch || 'proton_10.0' }}-Winlator-ARM64EC
          path: |
            output/*
          retention-days: 30

      # ------------------------------------------------------------
      # 17. 发布到 GitHub Release
      # ------------------------------------------------------------
      - name: 发布到 GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: proton-${{ github.event.inputs.proton_branch || 'proton_10.0' }}-winlator-arm64ec
          name: Proton ${{ github.event.inputs.proton_branch || 'proton_10.0' }} (Winlator ARM64EC)
          body: |
            # Proton ${{ github.event.inputs.proton_branch || 'proton_10.0' }} - Winlator ARM64EC 构建

            ## 构建信息
            - **Proton 分支**: ${{ github.event.inputs.proton_branch || 'proton_10.0' }}
            - **目标架构**: ARM64 (aarch64, i386)
            - **目标平台**: Winlator (Android)
            - **临时目录**: `${{ env.WINLATOR_TMP_DIR }}`
            - **运行时路径**: `${{ env.WINLATOR_RUNTIME_PATH }}`
            - **构建时间**: ${{ github.run_date }}
            - **提交哈希**: ${{ github.sha }}

            ## 路径配置
            - **动态链接器**: `/data/data/com.winlator/files/imagefs/usr/lib/ld-linux-aarch64.so.1`
            - **RPATH**: `/data/data/com.winlator/files/imagefs/usr/lib`
            - **安装路径**: `/data/data/com.winlator/files/imagefs/usr/opt/wine`

            ## 包含组件
            - ✓ ARM64 原生 Proton 可执行文件
            - ✓ 支持运行 32/64 位 Windows 应用程序
            - ✓ Winlator 专用路径配置（仅 com.winlator）
            - ⚠️ 不包含 prefixPack，需要单独配置

            ## 安装说明
            1. 解压 tar.xz 文件
            2. 将内容放置在 Winlator 的合适位置
            3. 确保路径配置与 Winlator 环境匹配
            4. 需要单独配置 prefix（Wine 前缀）
          files: |
            output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
